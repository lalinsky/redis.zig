name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        zig: [0.16.0, 0.17.0]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Zig
      uses: mlugg/setup-zig@v2
      with:
        version: ${{ matrix.zig }}

    - name: Check code formatting
      run: zig fmt --check .

    - name: Run tests
      run: zig build test

    - name: Build examples
      run: zig build examples
